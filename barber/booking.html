<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your booking — Fade &amp; Co</title>
<meta name="description" content="Look up, review or cancel your appointment at Fade & Co.">
<meta name="theme-color" content="#f2f1ee">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23a06f2e'/><text x='16' y='23' font-size='19' font-family='system-ui,sans-serif' font-weight='600' fill='%23fffdf9' text-anchor='middle'>F</text></svg>">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/site.css">

<script>
  document.documentElement.classList.add('js');
  try {
    var t = localStorage.getItem('fadeco.theme');
    document.documentElement.dataset.theme = (t === 'light' || t === 'dark') ? t
      : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch (e) {}
</script>
<script src="config.js"></script>
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<a class="skip-link" href="#main">Skip to content</a>

<div id="banner-slot"></div>

<header class="site-header">
  <div class="shell site-header-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark" data-brand-mark>F</span>
      <span class="brand-text">
        <span class="brand-name" data-brand-name>Fade &amp; Co</span>
        <span class="brand-tag">Your booking</span>
      </span>
    </a>
    <div class="site-header-actions">
      <button class="btn btn--icon btn--quiet" type="button" data-theme-toggle aria-label="Switch appearance"></button>
      <a class="btn btn--ghost btn--sm" href="index.html">Back to the site</a>
    </div>
  </div>
</header>

<main id="main">
  <div class="confirm-wrap">
    <section class="glass confirm-card" id="card" aria-live="polite">
      <div class="skeleton skeleton--avatar" style="margin:0 auto var(--space-5);width:76px;height:76px"></div>
      <div class="skeleton skeleton--text" style="width:60%;margin-inline:auto;height:1.6em"></div>
    </section>
  </div>
</main>

<footer class="site-footer site-footer--slim">
  <div class="shell footer-base">
    <p class="dim" data-footer-legal></p>
    <a class="dim" href="book.html">Book another appointment</a>
  </div>
</footer>

<script type="module" src="assets/js/confirmation.js"></script>
</body>
</html>
