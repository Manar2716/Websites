# Publishes the repository to GitHub Pages.
#
# There is no build step: every site in this repo is static, with no
# dependencies and no network calls, so the artifact is the checkout.
# The repo root is published, which keeps every site reachable —
# `/` is the printer page, `/peets/` is the coffee one and
# `/shrimparty/` is the seafood one.
#
# ── BEFORE THIS CAN EVER SUCCEED ──────────────────────────────────
#
# GitHub Pages must be switched on for the repository *by a human*,
# once:
#
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# `enablement: true` below was documented here as doing that
# automatically. It does not, and every run of this workflow has
# failed on it:
#
#   Get Pages site failed.    Error: Not Found
#   Create Pages site failed. Error: Resource not accessible by integration
#
# Creating a Pages site needs repository-administration scope, and
# the automatic GITHUB_TOKEN never has it — `permissions:` below
# already grants everything a workflow token can be given. So the
# flag is harmless once Pages exists and useless before then.
#
# After the setting above is flipped, re-run this workflow from the
# Actions tab (it has `workflow_dispatch`) or push again.
name: Pages

# The default branch is first, and it is the one that matters: a
# pull request merged into it must publish, or the site silently
# stops tracking `main` the moment anyone merges. The feature
# branches below it are here so a branch can be previewed before it
# is merged — remove one once its work has landed.
on:
  push:
    branches:
      - claude/3d-printer-scroll-animations-h3123z   # the default branch
      - claude/peets-coffee-website-sfihui
      - claude/shrimparty-cinematic-site-bh4nb8
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Pages strips paths that look like Jekyll internals unless this
      # file is present. Nothing here starts with an underscore today,
      # but the cost of being wrong later is a silently missing asset.
      - run: touch .nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
